name: v1.1.1 immutable game-set snapshots (WUPS)
on:
  push:
    branches:
      - feature/v1.1.1-game-set-audit-v12-planner
  pull_request:
    paths:
      - 'console_menu_db_integrated/**'
      - 'tests/test_v111_*'
      - '.github/workflows/v111-snapshot-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p 'test_v111_snapshot_integration.py' -v
      - run: python -m unittest discover -s tests -p 'test_v11_db_integration.py' -v
      - run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 tests/test_v111_game_set.c -o /tmp/v111hash
          /tmp/v111hash
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 tests/test_v11_wlpdb_core.c -o /tmp/v11db
          /tmp/v11db
  crossbuild:
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build experimental v1.1.1 WUPS
        run: |
          DOCKER_BUILDKIT=1 docker build --progress=plain -f console_menu_db_integrated/Dockerfile --target artifacts --output type=local,dest=console_menu_db_integrated/dist .
          test -s console_menu_db_integrated/dist/wiiu_library_profiles_v111_db_snapshot.wps
      - uses: actions/upload-artifact@v4
        with:
          name: WLP-v111-IMMUTABLE-DB-SNAPSHOT-WUPS
          path: console_menu_db_integrated/dist/wiiu_library_profiles_v111_db_snapshot.wps
          if-no-files-found: error
          retention-days: 14
