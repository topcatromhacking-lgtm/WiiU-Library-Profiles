name: WULP offline regression
on:
  push:
    paths: ["src/**", "tests/**", ".github/workflows/offline-regression.yml"]
  pull_request:
    paths: ["src/**", "tests/**", ".github/workflows/offline-regression.yml"]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python tests against synthetic data only
        run: python -m unittest discover -s tests -v
      - name: Compile and run portable v1.3.3 trace capture SHA-256 vectors
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_v133_trace_capture.c -o /tmp/wulp-v133-capture
          /tmp/wulp-v133-capture
      - name: Compile and run structure-only C test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_v132_barista_probe_core.c -o /tmp/wulp-barista-structure
          /tmp/wulp-barista-structure
      - name: Compile portable v1.3.4 physical-source classifier
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_v134_physical_source.c -o /tmp/wulp-v134-path
          /tmp/wulp-v134-path
      - name: Compile v1.3.4 C-to-Python synthetic active-layer snapshot fixture
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_v134_snapshot_capture.c -o /tmp/wulp-v134-snapshot
          /tmp/wulp-v134-snapshot > /tmp/wulp-v134-snapshot.jsonl
          test -s /tmp/wulp-v134-snapshot.jsonl
