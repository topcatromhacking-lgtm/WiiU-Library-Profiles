name: v1.2 read-only Menu profile preview
on:
  push:
    branches:
      - feature/v1.2-menu-readonly-preview
  pull_request:
    paths:
      - 'console_menu_profile_preview/**'
      - 'tests/test_v12_selection_core.c'
      - 'tests/test_v12_preview_integration.py'
      - '.github/workflows/v12-menu-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regression test v1.1.1 Menu filter hook preserved
        run: python -m unittest discover -s tests -p 'test_v12_preview_integration.py' -v
      - name: Portable C profile and DB tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tests/test_v12_selection_core.c -o /tmp/v12_core
          /tmp/v12_core
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tests/test_v111_game_set.c -o /tmp/v111_core
          /tmp/v111_core
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tests/test_v11_wlpdb_core.c -o /tmp/v11_db_core
          /tmp/v11_db_core
  crossbuild:
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated v1.2 Menu preview plugin
        run: |
          DOCKER_BUILDKIT=1 docker build --progress=plain -f console_menu_profile_preview/Dockerfile --target artifacts --output type=local,dest=console_menu_profile_preview/dist .
          test -s console_menu_profile_preview/dist/wiiu_library_profiles_v12_menu_preview.wps
      - uses: actions/upload-artifact@v4
        with:
          name: WLP-v12-READONLY-MENU-PREVIEW-WUPS
          path: console_menu_profile_preview/dist/wiiu_library_profiles_v12_menu_preview.wps
          if-no-files-found: error
          retention-days: 14
