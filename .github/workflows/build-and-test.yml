name: v0.1 checks and Wii U catalog probe

on:
  pull_request:
  push:
    branches:
      - feature/v0.1-readonly-catalog
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify offline profile engine
        run: python -m unittest discover -s tests -v
      - name: Check sample SNES profile
        run: >-
          python -m wiiu_library_profiles examples/catalog.json
          --overrides examples/overrides.json
          --profile examples/snes-profile.json

  build-readonly-probe:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
    steps:
      - uses: actions/checkout@v4
      - name: Build Wii U read-only catalog probe
        run: |
          make -C console_probe
          test -s console_probe/wiiu_library_profiles_probe.wuhb
      - name: Upload untested Wii U homebrew build
        uses: actions/upload-artifact@v4
        with:
          name: wiiu-library-profiles-catalog-probe-UNTESTED
          path: console_probe/wiiu_library_profiles_probe.wuhb
          if-no-files-found: error
          retention-days: 14
